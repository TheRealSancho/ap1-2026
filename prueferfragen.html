  color: rgb(185 28 28 / var(--tw-text-opacity, 1));
}

.text-white{
  --tw-text-opacity: 1;
  color: rgb(255 255 255 / var(--tw-text-opacity, 1));
}

.text-yellow-800{
  --tw-text-opacity: 1;
  color: rgb(133 77 14 / var(--tw-text-opacity, 1));
}

.accent-\[var\(--dark\)\]{
  accent-color: var(--dark);
}

.opacity-60{
  opacity: 0.6;
}

.opacity-70{
  opacity: 0.7;
}

.opacity-80{
  opacity: 0.8;
}

.shadow-\[0_8px_30px_rgba\(0\2c 0\2c 0\2c 0\.04\)\]{
  --tw-shadow: 0 8px 30px rgba(0,0,0,0.04);

}

.outline-none{
  outline: 2px solid transparent;
  outline-offset: 2px;
}

.filter{
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);

}

.backdrop-blur-xl{
  --tw-backdrop-blur: blur(24px);
  backdrop-filter: var(--tw-backdrop-blur) var(--tw-backdrop-brightness) var(--tw-backdrop-contrast) var(--tw-backdrop-grayscale) var(--tw-backdrop-hue-rotate) var(--tw-backdrop-invert) var(--tw-backdrop-opacity) var(--tw-backdrop-saturate) var(--tw-backdrop-sepia);
}

.transition{
  transition-property: color, background-color, border-color, text-decoration-color, fill, stroke, opacity, box-shadow, transform, filter, backdrop-filter;

.transition-shadow{
  transition-property: box-shadow;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

:root{
  --accent: #facc15;
  --accent-dark: #eab308;
  --dark: #0f172a;
  --surface: #ffffff;
  --surface-2: #f8fafc;
  --surface-3: #f1f5f9;
  --border: #e2e8f0;
  --text: #0f172a;
  --text-muted: #64748b;
  --green-bg: #f0fdf4;
  --green-border: #bbf7d0;
  --green-text: #166534;
}

* {
  font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
}

.mono {
  font-family: "JetBrains Mono", monospace;
}

@media print {
  .no-print {
    display: none !important;
  }

  .print-break {
    -moz-column-break-inside: avoid;
         break-inside: avoid;
  }
}

@media (prefers-color-scheme: dark){
  :root{
    --surface: #0f172a;
    --surface-2: #1e293b;
    --surface-3: #1e293b;
    --border: #334155;
    --text: #f8fafc;
    --text-muted: #94a3b8;
  }
}

.hover\:border-\[var\(--dark\)\]:hover{
  border-color: var(--dark);
}

.hover\:bg-\[\#fde047\]:hover{
  --tw-bg-opacity: 1;
  background-color: rgb(253 224 71 / var(--tw-bg-opacity, 1));
}

.hover\:bg-\[var\(--accent\)\]:hover{
  background-color: var(--accent);
}

.hover\:bg-\[var\(--dark\)\]:hover{
  background-color: var(--dark);
}

.hover\:text-white:hover{
  --tw-text-opacity: 1;
  color: rgb(255 255 255 / var(--tw-text-opacity, 1));
}

.hover\:shadow-\[0_8px_24px_rgba\(0\2c 0\2c 0\2c 0\.06\)\]:hover{
  --tw-shadow: 0 8px 24px rgba(0,0,0,0.06);

  box-shadow: var(--tw-ring-offset-shadow, 0 0 #0000), var(--tw-ring-shadow, 0 0 #0000), var(--tw-shadow);
}

@media (min-width: 768px){
  .md\:flex{
    display: flex;
  }

  .md\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .md\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .md\:grid-cols-6{
    grid-template-columns: repeat(6, minmax(0, 1fr));
  }

  .md\:grid-cols-\[1\.15fr_0\.85fr\]{
    grid-template-columns: 1.15fr 0.85fr;
  }

  .md\:px-8{
    padding-left: 2rem;
    padding-right: 2rem;
  }

  .md\:text-\[16px\]{
    font-size: 16px;
  }

  .md\:text-\[48px\]{
    font-size: 48px;
  }
}

ransformatoren, kapazitive Lasten mit höherem Einschaltstrom. Für FU-Zuleitung meist C16, für Steckdose B16. Selektivität beachten.",norm:"DIN VDE 0641-11, EN 60898-1"},{id:5,kategorie:"Elektrotechnik",schwierigkeit:"mittel",frage:"Nennstrom-Berechnung: Anlage 4,0 kW an 400V Drehstrom. Wie rechnest du In? Was bedeutet das für Leitungsquerschnitt?",tipp:"P = U*I*√3*cos phi",loesung:"I = P / (√3 * U * cosφ * η). Annahme cosφ 0,85, η 0,9: I = 4000 / (1,732*400*0,85*0,9) ≈ 7,5 A. Absicherung 16A wegen Anlauf. Leitung: 2,5mm² Kupfer ausreichend bis 20m, Spannungsfall <3% prüfen: ΔU = √3*I*L*cosφ / (γ*A).",norm:"DIN VDE 0100-430, DIN VDE 0298-4"},{id:6,kategorie:"Elektrotechnik",schwierigkeit:"schwer",frage:"Wie misst du den Isolationswiderstand R_iso? Warum >1 MΩ und mit 500V DC?",tipp:"SPS abklemmen!",loesung:"Messung zwischen allen aktiven Leitern L+N kurzgeschlossen gegen PE mit 500V DC Prüfspannung. SPS, HMI, G120C vorher abklemmen / trennen, sonst Zerstörung. Grenzwert: R_iso >1 MΩ für SELV/PELV Stromkreise, >0,5 MΩ für 230V. Messdauer bis stabil. Protokoll S41 Seite 42.",norm:"DIN VDE 0100-600 6.4.3.3, EN 60204-1 18.3"},{id:7,kategorie:"Elektrotechnik",schwierigkeit:"mittel",frage:"RCD Typ B 30mA <300ms – warum gerade Typ B bei FU G120C?",tipp:"Gleichfehlerstrom.",loesung:"Frequenzumrichter G120C erzeugt glatte Gleichfehlerströme >6mA durch Zwischenkreis. Typ A/AC erblindet. Typ B erkennt AC, pulsierende DC und glatte DC-Fehlerströme. Auslösezeit <300ms bei In, <150ms bei 5x In. Prüfung mit RCD-Tester Typ B. DIN verlangt Typ B wenn FU ohne Trenntrafo am Netz.",norm:"DIN VDE 0100-530 531.3.5, EN 50178, DGUV Information 203-006"},{id:8,kategorie:"Elektrotechnik",schwierigkeit:"leicht",frage:"Farbkennzeichnung nach EN 60204-1: PE, N, L, 24V DC P und M?",tipp:"gn/ge, blau...",loesung:"PE = grün/gelb gn/ge, N = hellblau, L1/L2/L3 = schwarz/braun/grau, 24V DC P = dunkelblau, M = blau-weiß bzw. blau mit Kennzeichnung. 0V bei AC = nicht grün/gelb/blau. Wichtig für Sichtprüfung Protokoll.",norm:"EN 60204-1 Kap. 14.2"},{id:9,kategorie:"Elektrotechnik",schwierigkeit:"mittel",frage:"Motorschutz: Warum Motorschutzschalter und nicht nur LS? Wie stellst du ihn ein?",tipp:"Thermisch + magnetisch.",loesung:"MSS hat thermische Überlast (bimetall, einstellbar nach Motornennstrom laut Typenschild) + magnetische Kurzschlussauslösung + Phasenausfallempfindlichkeit. LS schützt nur Leitung. Einstellung: Ie = Motornennstrom z.B. 2,5A aus p0304-p0311. Test: Auslösetest.",norm:"EN 60947-4-1, VDE 0113"},{id:10,kategorie:"Elektrotechnik",schwierigkeit:"schwer",frage:"Schaltplan lesen: Seite 7-8 I/O Liste B2-SM-gelb – wie gehst du bei Fehlersuche vor?",tipp:"Systematisch, nicht raten.",loesung:"1. Unterlagen sichten: Schaltplan Seite 7-8, Belegungsplan, Funktionsbeschreibung. 2. Sichtprüfung 12 Punkte. 3. Messen: Versorgung 24V, Eingänge mit Forcetabelle / Beobachtungstabelle, Ausgänge. 4. SPS-Diagnose: Online, LEDs, Diagnosepuffer. 5. Signal verfolgen: Sensor -> Eingangskarte -> Programm -> Ausgang -> Aktor. Dokumentieren!",norm:"DIN EN 60204-1, AP1 Leitfaden PAL"},{id:11,kategorie:"SPS S7-1200",schwierigkeit:"leicht",frage:"Was bedeutet S7-1214C DC/DC/DC 14E/10A und warum Transistor?",tipp:"Eingang/Ausgang Technik.",loesung:"14 digitale Eingänge 24V DC (Typ 3), 10 digitale Ausgänge Transistor 24V 0,5A. DC/DC/DC = Versorgung 24V DC / Eingänge 24V DC / Ausgänge 24V DC Transistor. Vorteil: schnelles Schalten, PWM, PTO für FU-Ansteuerung möglich, kein Verschleiß. Relais wäre AC/DC/Rly, langsamer, begrenzte Schaltspiele.",norm:"S7-1200 Systemhandbuch Kap. 8"},{id:12,kategorie:"SPS S7-1200",schwierigkeit:"mittel",frage:"OB, FC, FB, DB – Unterschiede erklären am Beispiel B2?",tipp:"Speicher, Instanz.",loesung:"OB1 = Main zyklisch, ruft alles auf. FC = Funktion ohne Gedächtnis, z.B. Füllstand-Berechnung Füllstand_FC – kein Speicher. FB = mit Gedächtnis, braucht Instanz-DB, z.B. Zylinder_FB mit Zuständen. DB = Datenbaustein: Global-DB für HMI-Signale, Instanz-DB für FB. Retentiv: Werte bleiben bei Spannungsausfall erhalten (z.B. Stückzahl).",norm:"IEC 61131-3, TIA Portal Hilfe"},{id:13,kategorie:"SPS S7-1200",schwierigkeit:"mittel",frage:"Retentivität – was und wo stellst du es ein? Was bei B2 retentiv?",tipp:"DB-Eigenschaften.",loesung:"Retentiv = nach Spannungsverlust Wert erhalten. Einstellung im DB unter Eigenschaften > Retain. Oder Merker unter PLC-Variablen > Retentiv. Bei B2: Stückzähler, Betriebsstunden, Fehlerzähler retentiv. I/O nicht retentiv. Anzahl begrenzt (S7-1214 ca. 14kB). Warmstart vs Kaltstart.",norm:"S7-1200 Handbuch Kap. 5.3"},{id:14,kategorie:"SPS S7-1200",schwierigkeit:"mittel",frage:"Steuern vs Forcen – Unterschied und Gefahr?",tipp:"Forcen bleibt nach Stop!",loesung:"Steuern = überschreibt einmalig für einen Zyklus im TIA, geht bei STOP/Online-Ende verloren – sicher für Test. Forcen = hardwareseitig fest auf Karte erzwungen, bleibt auch bei STOP, überschreibt Prozessabbild – Lebensgefahr bei Anlage! Nur mit Forcetabelle, Schlüsselschalter, Absprache. Protokollieren, nach Test sofort Force löschen.",norm:"DGUV Vorschrift 3, EN 60204-1 9.4.2.5.2"},{id:15,kategorie:"SPS S7-1200",schwierigkeit:"leicht",frage:"Hardwarekonfig: IP 192.168.0.1/24 – was bedeutet /24 und PROFINET Name?",tipp:"Subnetzmaske.",loesung:"/24 = Subnetzmaske 255.255.255.0 = 254 Adressen im Netz. SPS 192.168.0.1, KTP700 192.168.0.2, G120C 192.168.0.3, PC 192.168.0.10 – alle gleiche Maske. PROFINET Gerätename: z.B. plc-b2, hmi-b2, g120c-b2 – muss eindeutig sein, wird per DCP vergeben. IP und Name vor Download setzen.",norm:"PROFINET Norm IEC 61158, TIA Handbuch"},{id:16,kategorie:"SPS S7-1200",schwierigkeit:"mittel",frage:"Warum OB1 Zykluszeit überwachen? Was ist Zykluszeit bei B2?",tipp:"Watchdog.",loesung:"Zyklus = Eingänge lesen -> Programm abarbeiten -> Ausgänge schreiben. Bei B2 typisch 2-8ms. Wenn zu lang (>150ms) geht CPU in STOP wegen Zyklusüberwachung. Grund: Endlosschleife, zu viele DBs. Einstellen in CPU Eigenschaften > Zykluszeit. OB121 für Programmierfehler abfangen.",norm:"S7-1200 Systemhandbuch 4.2"},{id:17,kategorie:"SPS S7-1200",schwierigkeit:"schwer",frage:"Analogwertverarbeitung: 4-20mA Füllstandssensor an AI – Normierung/Skalierung?",tipp:"SCALE_X, NORM_X.",loesung:"AI 4-20mA = 0-27648. NORM_X: VALUE=27648 MIN=0 MAX=27648 -> 0.0-1.0. SCALE_X: 0.0-1.0 -> 0-100% Füllstand oder 0-10cm. Drahtbruch: bei <3,6mA Fehler. Im Programm: IF AI < 5530 THEN Fehler. Für KTP700 als % anzeigen.",norm:"IEC 61131, TIA Bibliothek LGF"},{id:18,kategorie:"SPS S7-1200",schwierigkeit:"leicht",frage:"Diagnosepuffer lesen – was steht drin und wie hilft er?",tipp:"Uhrzeit, Event.",loesung:"Diagnosepuffer: Zeitstempel, Ereignis-ID, CPU STOP Grund, PROFINET Teilnehmerausfall, Kurzschluss. Bei B2: z.B. G120C ausgefallen -> 02:39 IO device failure. Hilft bei Fehlersuche ohne Messgerät. Im TIA Online -> Diagnosepuffer. Export als Log.",norm:"TIA Portal Online Diagnose"},{id:19,kategorie:"SPS S7-1200",schwierigkeit:"mittel",frage:"Merker vs DB-Variable – warum heute fast nur DB?",tipp:"Strukturiert.",loesung:"Merker M0.0 sind global, unstrukturiert, kollidieren leicht, nicht retentiv übersichtlich. DB-Variablen 'HMI'.Stueckzahl sind strukturiert, symbolisch, optimierter Zugriff, besser für HMI-Anbindung. Optimierter DB = kein absoluter Zugriff, nur symbolisch. Für AP1: Immer DB verwenden.",norm:"Siemens Programmierrichtlinie"},{id:20,kategorie:"SPS S7-1200",schwierigkeit:"schwer",frage:"Flanken, TON, TOF, TP am Beispiel Vereinzelung B2?",tipp:"Impuls.",loesung:"P_TRIG = positive Flanke für Zählung. TON = Einschaltverzögerung für Zylinder Endlage bestätigt nach 2s. TOF = Ausschaltverzögerung für Blasen. TP = Impuls 500ms für Vereinzelner. Bei B2: TP für Auswerfer. Wichtig: Timer als IEC-Timer mit DB instanziieren.",norm:"IEC 61131-3"},{id:21,kategorie:"HMI & Antrieb G120C KTP700",schwierigkeit:"mittel",frage:"KTP700 HMI-Verbindung zu S7-1214 – wie projektierst du das?",tipp:"HMI-Verbindung im TIA.",loesung:"Im TIA: Geräte hinzufügen KTP700 Basic, Verbindung ziehen: SPS <-> HMI HMI-Verbindung PROFINET. Variablen: HMI-Variablen aus SPS-DBs per Drag&Drop mit HMI-Symbol aktivieren. Kein unspezifiziertes Gerät. IP wie oben. Test: HMI Simulation mit PC.",norm:"TIA WinCC Handbuch"},{id:22,kategorie:"HMI & Antrieb G120C KTP700",schwierigkeit:"mittel",frage:"G120C Inbetriebnahme: Was bedeutet p0010=30 und welche Parameter danach?",tipp:"Schnellinbetriebnahme.",loesung:"p0010=30 = Werkseinstellung / Schnellinbetriebnahme. Dann p0304=400V Motorspannung, p0305=Nennstrom, p0307=Leistung, p0310=Frequenz 50Hz, p0311=Drehzahl z.B. 1450, p1900=2 Motoridentifikation still. Danach p0010=0. Wichtig: Daten in RAM->ROM mit p0971=1 speichern.",norm:"G120C Betriebsanleitung LH13"},{id:23,kategorie:"HMI & Antrieb G120C KTP700",schwierigkeit:"mittel",frage:"G120C Steuerung: p1000, p1070, Rampen – erkläre!",tipp:"Sollwertquellen.",loesung:"p1000=6 = Feldbus Sollwert PROFINET. p1070= Haupt-Sollwert 2050 = PZD2 von SPS. p1075 Zusatz. p1120 Rampenauf 0-650s z.B. 2s, p1121 Rampa ab 2s, p1135 OFF3. Bei B2: Rampe 1s für Magazin. p1080 min Drehzahl, p1082 max.",norm:"G120C Parameterliste"},{id:24,kategorie:"HMI & Antrieb G120C KTP700",schwierigkeit:"leicht",frage:"Was zeigt die KTP700 im Betrieb an und welche Meldungen gibt es?",tipp:"Stückzahl, Modus.",loesung:"Startbild: Modus Hand/Auto, Stückzahl Ist/Soll, Füllstand, Band Geschwindigkeit, Störmeldungen. Alarme: Not-Halt aktiv, FU Störung, Pneumatik Druck <5bar, Sensorfehler. Quittierung über HMI Button. Daten aus SPS DB HMI.",norm:"PAL Prüfungsstück B2-SM Beschreibung"},{id:25,kategorie:"HMI & Antrieb G120C KTP700",schwierigkeit:"schwer",frage:"PROFINET IO: Was tun wenn G120C im TIA mit rotem Kreuz?",tipp:"Name, IP, Topologie.",loesung:"Ursache: Gerätename/IP mismatch. Lösung: Online Zugang -> erreichbare Teilnehmer -> G120C auswählen -> Name zuweisen p-> g120c-b2, IP 192.168.0.3. Dann Topologie prüfen. Diagnose: Im Online Status G120C nicht erreichbar -> Kabel, Switch. LED: BF blinkt = kein Datenaustausch.",norm:"PROFINET Guideline"},{id:26,kategorie:"HMI & Antrieb G120C KTP700",schwierigkeit:"mittel",frage:"Telegramm 352 bei G120C – was wird übertragen?",tipp:"PZD.",loesung:"Standardtelegramm 352: 6/2 PZD. Vom SPS zum FU: STW1 Steuerwort, HSW Hauptsollwert. Vom FU zur SPS: ZSW1 Zustandswort, HIW Hauptistwert, IA, IM, Fehler. B2 nutzt meist Telegramm 1 oder 352. In Hardwarekonfig Telegramm einstellen und im SPS Programm SINA_SPEED FB nutzen.",norm:"PROFIdrive Profil"},{id:27,kategorie:"HMI & Antrieb G120C KTP700",schwierigkeit:"leicht",frage:"FU Sicherheit: Warum Netzfilter und Schirmung?",tipp:"EMV.",loesung:"FU erzeugt EMV Störungen durch schnelles Schalten. Maßnahmen: Geschirmte Motorleitung beidseitig auflegen, Schirmblech, Netzfilter integriert, PE niederohmig. Leitungslänge <25m wegen Ableitstrom. Prüfen nach EN 61800-3.",norm:"EN 61800-3, EN 60204-1 EMV"},{id:28,kategorie:"HMI & Antrieb G120C KTP700",schwierigkeit:"schwer",frage:"Datensicherung: Wie sicherst du SPS, HMI, G120C Programm?",tipp:"Archivieren.",loesung:"TIA Projekt archivieren als .zap16, auf USB. G120C Parameter mit Startdrive sichern und p0971=1. HMI mit drin. Version: F26 0942 B2-SM-gelb V1.2. Im Fachgespräch zeigen: Projektpfad, Sicherung vorhanden.",norm:"TIA Portal V19"},{id:29,kategorie:"HMI & Antrieb G120C KTP700",schwierigkeit:"mittel",frage:"Drehrichtung ändern – elektrisch und über Parameter?",tipp:"Phasen, p1113.",loesung:"Hardware: Zwei Phasen am Motor tauschen -> gefährlich bei FU. Besser: p1113=1 Drehrichtungsumkehr oder Sollwert negativ. Bei B2: Band vorwärts/rückwärts über p1113 per SPS BOOL invertiert. NOT-HALT bleibt unabhängig.",norm:"G120C Handbuch"},{id:30,kategorie:"HMI & Antrieb G120C KTP700",schwierigkeit:"leicht",frage:"LEDs am G120C: RDY, BF – was bedeuten sie?",tipp:"Grün, rot.",loesung:"RDY grün dauer = betriebsbereit, gelb blinkt = Inbetriebnahme, rot = Fehler. BF rot = Busfehler PROFINET. LNK grün = Link vorhanden. Bei B2: Nach Einschalten RDY grün, BF aus = ok.",norm:"G120C HW Install Guide"},{id:31,kategorie:"Pneumatik",schwierigkeit:"leicht",frage:"5/2-Wegeventil monostabil vs bistabil – Unterschied bei B2?",tipp:"Feder, Memory.",loesung:"Monostabil: 1 Spule, 1 Feder, bei Spannungsausfall definierte Grundstellung (ausgefahren/eingefahren) – sicher! Bistabil: 2 Spulen, bleibt in letzter Stellung (Memory), braucht 2 Ausgänge, gefährlich bei Not-Halt. B2 verwendet monostabil für Auswerfer (Feder fährt ein bei Not-Halt). Symbol: monostabil mit Feder.",norm:"ISO 1219-1, Festo Handbuch"},{id:32,kategorie:"Pneumatik",schwierigkeit:"mittel",frage:"Abluftdrossel vs Zuluftdrossel – wo und warum Abluft bei B2?",tipp:"Gleichmäßigkeit.",loesung:"Abluftdrossel = Drosselrückschlagventil direkt am Zylinder Abluft drosseln, Zuluft frei. Vorteil: gleichmäßige Geschwindigkeit, Lastunabhängigkeit, Ruckfrei. Zuluftdrossel würde bei Lastwechseln springen. Bei B2: Beide Zylinder mit Abluftdrossel einstellen: Drossel zudrehen, dann 1/2 Umdrehung auf, bis sanft.",norm:"Festo Pneumatik Grundlagen"},{id:33,kategorie:"Pneumatik",schwierigkeit:"mittel",frage:"Zylinderkraft: Formel F = p*A, rechne für Ø32 bei 6 bar!",tipp:"Fläche!",loesung:"A = π*d²/4 = π*0,032²/4 = 0,000804 m². F_theoretisch = p*A = 6e5 Pa * 0,000804 = 482 N. Effektiv: Abzug Reibung, Stangenfläche, Wirkungsgrad 0,9: F_eff ≈ 430 N ausfahrend, einfahrend A_Ring = A_Kolben - A_Stange, kleiner. Für B2 reicht 400N zum Vereinzeln.",norm:"ISO 15552"},{id:34,kategorie:"Pneumatik",schwierigkeit:"leicht",frage:"Wartungseinheit: Bestandteile und Einstellung?",tipp:"Filter, Regler, Öler.",loesung:"Besteht aus: Filter 40µm + Wasserabscheider, Druckregelventil 0,5-10 bar mit Manometer, ggf. Öler (heute meist ölfrei!). Einstellung: Betriebsdruck 6 bar für Zylinder, 5 bar für Vakuum. Kondensat täglich ablassen, Filter reinigen. Bei B2 kein Öler, ölfreie Anlage.",norm:"DIN ISO 4414"},{id:35,kategorie:"Pneumatik",schwierigkeit:"leicht",frage:"Endlagensensoren: Wie justierst du Reed-Sensoren?",tipp:"LED.",loesung:"Reed/Magnetfeldsensor in Nut verschieben, Zylinder in Endlage fahren, LED muss angehen, 0,5mm über Endlage hinaus einstellen für Überlauf. Festziehen 0,4 Nm. Typ: PNP Schließer 24V. Bei B2 4 Sensoren prüfen.",norm:"Festo Sensorik"},{id:36,kategorie:"Pneumatik",schwierigkeit:"mittel",frage:"Vakuumsauger B2 – wie funktioniert und welche Störung typisch?",tipp:"Venturi.",loesung:"Venturi-Düse erzeugt Vakuum aus Druckluft nach Bernoulli. Sauger -0,7 bar hebt Plättchen. Typische Fehler: Düse verstopft, Sauger porös, Schlauch undicht, Druck <5 bar. Prüfung: Vakuumschalter einstellen -0,5 bar schaltet. Wartung: Filter.",norm:"Vakuumtechnik Grundlagen"},{id:37,kategorie:"Pneumatik",schwierigkeit:"mittel",frage:"Schaltplan Pneumatik lesen – was bedeuten 1A1, 1V1, 0Z1?",tipp:"DIN ISO 1219-2.",loesung:"Benennung: 0Z = Versorgung (0Z1 Wartungseinheit), 1A = Antrieb (1A1 Auswerferzylinder), 1V = Ventil (1V1 5/2 Wege), 1S = Sensor. Zweite Ziffer fortlaufend. Hilft bei Fehlersuche Seite 7-8: von 1A1 zu 1V1 zu SPS Ausgang Q0.3 verfolgen.",norm:"DIN ISO 1219-2"},{id:38,kategorie:"Pneumatik",schwierigkeit:"schwer",frage:"Schnellentlüftungsventil – wann sinnvoll bei B2?",tipp:"Hubzeit.",loesung:"Schnellentlüftung direkt am Zylinder lässt Abluft schnell ins Freie statt durch Ventil/Schlauch. Verkürzt Rückfahrzeit um 50%. Sinnvoll bei großem Hub, schnellem Takt. Bei B2 nicht verbaut, aber bei Auswerfer denkbar. Nachteil: lauter, Schalldämpfer nötig.",norm:"Pneumatik Zubehör"},{id:39,kategorie:"Pneumatik",schwierigkeit:"leicht",frage:"Druckabfall in Pneumatik – wie erkennen und beheben?",tipp:"Leck, Querschnitt.",loesung:"Erkennen: Manometer fällt <5 bar, Zylinder langsam, Lecksuchspray. Ursachen: Leckage Kupplung, zu kleiner Schlauch 4mm statt 6mm, zu lange Leitung, Kondensat. Beheben: Push-in neu schneiden gerade, Schlauch gerade, Druck erhöhen, Wartungseinheit reinigen.",norm:"DIN ISO 4414"},{id:40,kategorie:"Pneumatik",schwierigkeit:"mittel",frage:"Not-Halt Pneumatik: Was muss passieren?",tipp:"Entlüften.",loesung:"Bei Not-Halt muss Druckluft sicher abgebaut werden, Zylinder in sichere Stellung (monostabil Feder). Realisiert durch Sicherheitsventil 5/2 mit Federrückstellung und Entlüftung. Wiederanlauf verhindern: Zweihand oder Reset. Prüfung: Not-Halt drücken -> Manometer 0 bar, Zylinder eingefahren.",norm:"EN ISO 13849-1, EN 60204-1"},{id:41,kategorie:"Sicherheit DGUV V3",schwierigkeit:"leicht",frage:"Die 5 Sicherheitsregeln – aufsagen und auf B2 anwenden!",tipp:"Freischalten...",loesung:"1. Freischalten (CEE ziehen / Hauptschalter 0), 2. Gegen Wiedereinschalten sichern (Schloss), 3. Spannungsfreiheit feststellen (2-polig Duspol L1-L3, L-PE), 4. Erden und Kurzschließen (ab 1000V, bei uns entfall), 5. Benachbarte spannungsführende Teile abdecken. Bei B2 vor jeder Messung anwenden, PSA.",norm:"DIN VDE 0105-100, DGUV Vorschrift 3"},{id:42,kategorie:"Sicherheit DGUV V3",schwierigkeit:"mittel",frage:"Sichtprüfung 12 Punkte – welche laut Protokoll S41?",tipp:"Gehäuse, Leitungen...",loesung:"1. Gehäuse/Berührungsschutz, 2. Leitungen/Isolierung, 3. Zugentlastung, 4. Schutzleiteranschluss, 5. Kennzeichnung/ Typenschild, 6. Schaltplan vorhanden, 7. Klemmen fest, 8. Schutzabdeckungen, 9. NOT-HALT Funktion, 10. Warnhinweise, 11. FI/RCD vorhanden, 12. Betriebsmittel geeignet IP. Alles i.O. ankreuzen auf S41 Seite 1.",norm:"DIN VDE 0100-600 6.4.2, DGUV V3 Prüfprotokoll"},{id:43,kategorie:"Sicherheit DGUV V3",schwierigkeit:"mittel",frage:"Erstprüfung vs Wiederholungsprüfung nach DGUV V3 – Unterschied?",tipp:"Intervalle.",loesung:"Erstprüfung nach Errichten (wie bei B2 AP1). Wiederholungsprüfung alle 4 Jahre ortsfest, 1 Jahr ortsveränderlich, 6 Monate Baustelle. Umfang gleich: Sicht, Messen, Erproben. Dokumentation: Prüfprotokoll S41 aufbewahren. Prüfer: befähigte Person Elektrofachkraft.",norm:"DGUV Vorschrift 3 §5, TRBS 1201"},{id:44,kategorie:"Sicherheit DGUV V3",schwierigkeit:"leicht",frage:"PSA bei Messung – was trägst du?",tipp:"Brille, Schuhe.",loesung:"Isolierte Sicherheitsschuhe S3, Schutzbrille bei Lichtbogen, isolierte Handschuhe bei >50V AC, geeignetes Messgerät CAT III 1000V. Keine Metalluhren. Arbeitsplatz absperren. Zweite Person in Nähe.",norm:"DGUV Regel 103-011"},{id:45,kategorie:"Sicherheit DGUV V3",schwierigkeit:"mittel",frage:"Not-Halt Kategorie 0 vs 1 – was hat B2?",tipp:"Sofort vs kontrolliert.",loesung:"Kat 0 = sofortiges Abschalten Energie (unkontrolliert). Kat 1 = kontrolliertes Stillsetzen dann Abschalten. B2 hat Kat 0/1 kombiniert: SPS Stop + FU Schnellstopp Rampe p1135 dann Schütz ab. Not-Halt Taster 2-kanalig, Sicherheitsrelais oder F-DI bei S7-1200F (falls vorhanden). Prüfung: NOT-HALT schaltet Q sperr.",norm:"EN ISO 13850, EN 60204-1 9.4"},{id:46,kategorie:"Sicherheit DGUV V3",schwierigkeit:"schwer",frage:"Schutz gegen Wiedereinschalten – wie sicherst du praktisch?",tipp:"Schloss, Schild.",loesung:"Hauptschalter abschließbar mit Vorhängeschloss, Schlüssel behalten. CEE Stecker unter Aufsicht oder abschließbare Box. Schild 'Nicht einschalten – Prüfung'. Bei AP1: Prüfer übernimmt Sicherung, Dokumentation. Nach Prüfung Freigabe.",norm:"DIN VDE 0105-100 6.2.4"},{id:47,kategorie:"Sicherheit DGUV V3",schwierigkeit:"mittel",frage:"Spannungsfreiheit feststellen – mit welchem Gerät, wie?",tipp:"Duspol, nicht Multimeter!",loesung:"Zweipoliger Spannungsprüfer nach EN 61243-3 (Duspol), CAT IV. Vorher Funktionstest an bekannter Quelle. Messung L1-L2, L2-L3, L1-L3, L1-PE, L2-PE, L3-PE. Einpoliger Phasenprüfer verboten! Multimeter nicht ausreichend sicher.",norm:"EN 61243-3, DIN VDE 0105-100"},{id:48,kategorie:"Sicherheit DGUV V3",schwierigkeit:"leicht",frage:"Was ist der Unterschied Schutzmaßnahme und Schutzart?",tipp:"SK vs IP.",loesung:"Schutzmaßnahme = Schutz gegen elektrischen Schlag (Schutzklasse I, II, PELV). Schutzart = IP Schutz gegen Fremdkörper/Wasser. Beide im Protokoll prüfen. B2: Schutzmaßnahme SK I, Schutzart IP54.",norm:"DIN EN 61140, DIN EN 60529"},{id:49,kategorie:"Sicherheit DGUV V3",schwierigkeit:"mittel",frage:"Dokumentation: Was muss ins Messprotokoll S41?",tipp:"Messwerte, Datum, Unterschrift.",loesung:"Anlagendaten, Prüfer, Datum, Sichtprüfung Ergebnis, R_PE Werte pro Messpunkt <0,3Ω, R_iso >1MΩ, RCD Auslösezeit und Strom, Funktionsprüfung Not-Halt, Unterschrift befähigte Person. Bei Mängel: Frist, Nachprüfung. Aufbewahrung 4 Jahre.",norm:"DIN VDE 0100-600 Anhang, DGUV V3"},{id:50,kategorie:"Sicherheit DGUV V3",schwierigkeit:"schwer",frage:"Fehlerstromkreis bei B2 – warum löst RCD Typ B bei 30mA nicht beim normalen Betrieb aus?",tipp:"Ableitströme.",loesung:"G120C hat Ableitstrom 10-20mA durch EMV Filter, darf nicht >0,5*IΔn sein. 30mA RCD würde bei 2 FUs evtl. Fehlauslösung. Lösung: Typ B mit 300mA für Brandschutz + 30mA Typ B nur für Steckdosenkreis. Oder Trenntrafo. Bei B2: RCD 30mA Typ B überwacht nur Steuerstromkreis, nicht Haupt FU direkt.",norm:"DIN VDE 0100-530"},{id:51,kategorie:"Fachgespräch",schwierigkeit:"mittel",frage:"Erkläre in 2 Minuten deinen Prüfungsaufbau B2-SM-gelb!",tipp:"Ablauf: Materialzufuhr...",loesung:"B2-SM: Magazin stapelt Plättchen, Vereinzelner pneumatisch schiebt 1 Plättchen auf Band. Band mit G120C FU fördert zum Drehtisch? / zur Prüfung. Sensoren: Kapazitiv Magazin leer, Induktiv Band. Aktorik: 2x Zylinder, 1x Motor FU, Vakuum. Ablauf SPS: Auto-Modus Startbedingung Lichtschranke + Magazin nicht leer, Vereinzeln -> Band Start -> Stück zählen auf KTP700. Not-Halt stoppt alles.",norm:"PAL Prüfungsbeschreibung F26 0942"},{id:52,kategorie:"Fachgespräch",schwierigkeit:"leicht",frage:"Welche Unterlagen nutzt du bei Fehlersuche? Nenne 5!",tipp:"Schaltplan, I/O Liste...",loesung:"1. Stromlaufplan Seite 7-8, 2. Belegungsplan Klemmen, 3. I/O Liste Sensor/Aktor, 4. Funktionsbeschreibung/PAL Heft, 5. Datenblätter Motor G120C KTP700, 6. Messprotokoll S41, 7. TIA Projekt. Systematisch vorgehen: Sicht -> Messen -> Software.",norm:"PAL Leitfaden AP1"},{id:53,kategorie:"Fachgespräch",schwierigkeit:"mittel",frage:"Systematische Fehlersuche – Beispiel Band läuft nicht!",tipp:"Eingang -> SPS -> Ausgang.",loesung:"1. Sicht: NOT-HALT? Sicherung? 2. HMI Störung? 3. SPS Online: Eingang Start? Ausgang Q für FU Freigabe aktiv? 4. Messen: 24V am FU Klemme DI0? 5. FU Diagnose: Fehlercode F... 6. Motor: Spannung messen. 7. Dokumentieren. Lösung z.B. Drahtbruch Sensor X -> reparieren.",norm:"EN 60204-1 Fehlersuche"},{id:54,kategorie:"Fachgespräch",schwierigkeit:"schwer",frage:"Was machst du wenn Iso-Messung 0,2 MΩ statt >1 MΩ ergibt?",tipp:"Feuchte, Fremdkörper.",loesung:"Fehlerort eingrenzen: Teilstromkreise trennen, nacheinander messen. Ursache: Feuchtigkeit Schaltschrank, beschädigte Leitung, Metallspäne, falsches Klemmen. SPS war abgeklemmt? Wenn nein -> evtl. defekt. Beheben: trocknen, Leitung tauschen, neu messen. Erst bei >1MΩ freigeben.",norm:"DIN VDE 0100-600"},{id:55,kategorie:"Fachgespräch",schwierigkeit:"mittel",frage:"Nachhaltigkeit/Ordnung am Arbeitsplatz – was zeigst du Prüfern?",tipp:"5S.",loesung:"5S: Sortieren, Systematisieren, Säubern, Standardisieren, Selbstdisziplin. Kabelbinder, keine losen Leitungen, Werkzeug geordnet, Abfälle trennen Kupfer/Kunststoff, ESD, PSA. Dokumentation sauber. Zeigt Fachkompetenz.",norm:"PAL Bewertungsbogen"},{id:56,kategorie:"Fachgespräch",schwierigkeit:"leicht",frage:"Warum TIA Portal Projekt strukturiert mit FCs/FBs und nicht alles in OB1?",tipp:"Wiederverwendbar, lesbar.",loesung:"Strukturiert = übersichtlich, wiederverwendbar, leichter testen, Fehler finden. OB1 nur Aufrufe: FC_Init, FB_Band, FB_Zylinder. Kommentar, Symbolik. Prüfer sieht Qualität. Entspricht IEC 61131.",norm:"Siemens Styleguide"},{id:57,kategorie:"Fachgespräch",schwierigkeit:"mittel",frage:"Prüfprotokoll vorstellen – wie erklärst du R_PE <0,3Ω?",tipp:"200mA, CEE.",loesung:"Ich messe mit Niederohmmessung 200mA von PE CEE zu allen Metallteilen laut Liste S41: Gehäuse 0,12Ω, Motor 0,18Ω, Zylinder 0,21Ω – alle <0,3Ω -> bestanden. Messgerät kalibriert. Bedeutung: Bei Fehler wird Strom sicher über PE abgeleitet, Sicherung löst aus.",norm:"DIN VDE 0100-600"},{id:58,kategorie:"Fachgespräch",schwierigkeit:"mittel",frage:"Wie stellst du sicher dass nach deiner Änderung die Anlage sicher bleibt?",tipp:"Funktionsprüfung.",loesung:"Nach jeder Änderung: Sichtprüfung, Schutzleiter nochmal Stichprobe, Funktionsprüfung Auto/Hand, Not-Halt Test, RCD Test, Dokumentation Änderung im Schaltplan rot. Erst dann Freigabe. Kein Forcen drin lassen!",norm:"EN 60204-1 18.6"},{id:59,kategorie:"Fachgespräch",schwierigkeit:"leicht",frage:"Was bedeutet B2-SM-gelb – Farbcodierung?",tipp:"Material.",loesung:"B2 = Prüfungsstück Typ B2 Sortier/Magazin, SM = Sortier-Magazin, gelb = Werkstückfarbe gelb für Sortierung. Gelbe Plättchen = Gutteil, andere Farbe Ausschuss. Für AP1 F26 0942 festgelegt.",norm:"PAL Stückliste"},{id:60,kategorie:"Fachgespräch",schwierigkeit:"schwer",frage:"Was wenn Prüfer fragt: Darf ich die Anlage jetzt einschalten? Was prüfst du vorher?",tipp:"Vor Inbetriebnahme Check.",loesung:"Vor Freigabe: 1. Alle Werkzeuge entfernt? 2. Schutzabdeckungen drauf? 3. PE gemessen? 4. Iso gemessen? 5. Sicht i.O.? 6. Funktionsprüfung ohne Material? 7. Not-Halt getestet? Dann erst: Anlage freigeben, Einweisung, Hauptschalter Ein, Auto starten. Dokumentieren.",norm:"EN 60204-1 18.2, DGUV V3"}],Oc=["Alle","Elektrotechnik","SPS S7-1200","HMI & Antrieb G120C KTP700","Pneumatik","Sicherheit DGUV V3","Fachgespräch"];function bo(){let[e,t]=$e.useState(!1),[n,r]=$e.useState("Alle"),[l,i]=$e.useState(""),[o,u]=$e.useState({}),[s,d]=$e.useState(!1),[m,g]=$e.useState([]),h=$e.useMemo(()=>{let p=ur;if(s)p=ur.filter((I)=>m.includes(I.id));if(n!=="Alle")p=p.filter((I)=>I.kategorie===n);if(l.trim()){let I=l.toLowerCase();p=p.filter((c)=>c.frage.toLowerCase().includes(I)||c.loesung.toLowerCase().includes(I)||c.norm.toLowerCase().includes(I))}return p},[n,l,s,m]),k=()=>{if(s)d(!1),g([]);else{let p=[...ur].sort(()=>0.5-M
